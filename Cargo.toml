[package]
name = "ferrispass"
version = "0.9.2"
authors = ["Elias Tilegant <45147025+elias-tilegant@users.noreply.github.com>"]
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "A native, KeePass-compatible password manager for macOS, written in Rust on GPUI."
readme = "README.md"
repository = "https://github.com/elias-tilegant/ferrispass"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = 0
incremental = false

# Build scripts and proc macros keep their symbols. They run on the build
# machine and never end up in the app. With Apple's toolchain 27 and a
# deployment target of 12.0 or later, dyld refuses the stripped proc-macro
# dylibs ("mis-aligned LINKEDIT string pool") and the build stops with
# E0463 for ztracing_macro. The shipped binaries are still stripped.
[profile.release.build-override]
strip = "none"

[dependencies]
# Pinned to the elias-tilegant/keepass-rs fork. It carries three KDBX 4
# write-path interop fixes (AES-KDF UUID, omit-None-Option XML fields, base64
# timestamps) without which the upstream `save_kdbx4` path produces files
# KeePass2 and KeePassXC cannot read, plus the attachment-aware and
# custom-icon-aware merge this app relies on, which compares icons by the
# picture behind the reference rather than by its id. Re-evaluate the pin if
# those land upstream; bump it deliberately and re-run the interop round trip
# against KeePassXC first.
keepass = { git = "https://github.com/elias-tilegant/keepass-rs", rev = "b1093d2", features = ["save_kdbx4", "totp", "_merge"] }
# GPUI ships as the crates.io snapshot family `gpui-pre` (0.3.8 = zed@279fe07).
# gpui-component requires exactly this snapshot (=0.3.8); these pins must match it,
# or resolution fails loudly instead of drifting. On every bump: diff the snapshot
# against its Zed commit (scripts/verify-gpui-pre.sh), read the GPUI Kit release
# notes, and keep CI on --locked.
# Held by Cargo.lock alone, not by these pins: gpui-base and
# gpui-component-macros at 0.7.1 (gpui-component asks only for ^0.7.1; set with
# `cargo update -p <crate> --precise 0.7.1`), and the Zed exact pins gpui-pre
# relaxed to `^` (objc2-*, cocoa, taffy). A bare `cargo update` lifts them all,
# and gpui-base 0.7.2 also brings gpui-fast into the lock.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
gpui-component = "=0.7.1"
gpui-kit-assets = "=0.7.1"
rust-embed = "8"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zxcvbn = { version = "3", default-features = false }
thiserror = "2"
rand = "0.9"
# The only HTTP transport: sign-in, Graph metadata, vault and update-bundle
# transfers, favicons. `ureq` used to carry the metadata half and read neither
# the macOS system proxy nor the system trust store, so on a managed Mac behind
# a proxy the downloads worked while sign-in and the update check failed.
# `system-proxy` and `rustls-tls-native-roots` are explicit because default
# features are off; both are load-bearing, not conveniences.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "system-proxy"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `apple-native` enables the macOS Keychain backend (the only platform we
# verify in this MVP). Linux/Windows users can build with their own feature
# flags but those code paths aren't tested.
keyring = { version = "3", features = ["apple-native"] }
url = "2"
sha2 = "0.10"
notify = "8"
# Auto-update: cargo-packager parses cross-platform release metadata. FerrisPass
# verifies signed metadata and uses its own transactional installer on macOS.
cargo-packager-updater = "0.2"
minisign-verify = "0.2"
semver = "1"
# Used to wrap the embedded minisign public key in base64 at runtime.
# `cargo-packager-updater` expects `Config::pubkey` as base64(file content),
# not the raw minisign-pub.txt - see `update/client.rs::build_config`.
base64 = "0.22"
# Direct uuid dep so merge.rs can re-hydrate EntryId from a stringified
# UUID (`EntryId::from_uuid(Uuid::parse_str(s)?)`). Same crate the keepass
# dep already pulls in transitively; pinning major matches keepass-rs's
# expectation (1.x).
uuid = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
# Ctrl+C handling for `ferrispass-cli launch`. That command stages a 0600
# file holding a cleartext password and has to keep it alive while the target
# app reads it; a signal in that window skips every destructor. `ctrlc` runs
# the handler on its own thread rather than inside the signal context, so it
# can unlink a file, which a raw `signal(2)` handler could not do safely, and
# it needs no `unsafe` in this crate.
ctrlc = "3"

# Auto-type stack. The crates encapsulate macOS FFI internally so our
# workspace `unsafe_code = "forbid"` lint stays intact - `src/autotype/`
# only ever calls into safe wrappers. global-hotkey is the Tauri team's
# Carbon `RegisterEventHotKey` wrapper; enigo synthesises CGEvent
# keystrokes; active-win-pos-rs reads NSWorkspace + AX for the
# foreground window title; macos-accessibility-client wraps
# `AXIsProcessTrustedWithOptions` so we can probe and request the TCC
# Accessibility grant required for both keystroke synthesis and AX
# window-title reads. All four compile on Linux (no-op'd at the
# `cfg(target_os = "macos")` boundaries inside `src/autotype/`) so
# `cargo check` on dev Linux boxes still works.
global-hotkey = "0.8"
enigo = "0.6"
active-win-pos-rs = "0.10"
macos-accessibility-client = "0.0"

# Local fuzzy search ranker for the entry list. Pure in-memory, no index on
# disk - keeps with the rule that no plaintext vault metadata may be persisted.
nucleo-matcher = "0.3"

# Biometric unlock. `zeroize` is used only on the cleartext-password buffer
# between the OS keychain handing it back and `KeePassRepository::open`
# consuming it - a narrow window that's worth wiping. `security-framework`
# is macOS-only; non-Apple targets fall back to the noop store in
# `src/biometric/noop.rs`, so cargo check still passes on Linux/Windows.
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
async-channel = "2"
flate2 = "1"
libc = "0.2"
tar = "0.4"
tempfile = "3"
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
# Biometric verification for Touch ID. The keychain item itself lives in
# the legacy file-based macOS keychain (no entitlement required); the
# OS biometric prompt is driven separately via LAContext from this
# crate. This split is the same pattern Bitwarden / 1Password use for
# their Developer-ID-distributed Mac builds - the iOS-style
# `kSecAttrAccessControl` ACL would force the data-protection keychain,
# which isn't reachable without an App-Store provisioning profile.
# `objc2-local-authentication` wraps the LocalAuthentication framework
# on top of the `objc2` runtime we already pull in transitively via
# gpui. The bindings still expose `unsafe fn` for ordinary calls, so
# `src/biometric/macos.rs` opts into `#![allow(unsafe_code)]` for a
# small, audited surface (LAContext construction + evaluatePolicy +
# the NSError deref in the reply block); that's why the workspace lint
# is `unsafe_code = "deny"` rather than `forbid`.
objc2-local-authentication = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSWorkspace"] }
objc2-foundation = "0.3"
objc2 = "0.6"
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
# Property tests (T0.4 in the redesign plan, approved 14.10.2026): a failing
# case is shrunk to a small one before it is reported. gpui-pre's test-support
# pulls in the same version, so the lock gains no package.
proptest = "1"
# Headless UI tests (`#[gpui::test]`, `TestAppContext`). These are the features
# gpui-kit's `test-support` turns on, minus the gpui-kit facade itself:
# gpui-pre-macros rewrites every generated `gpui::` path to `gpui_kit::` as soon
# as the manifest names gpui-kit, dev-dependencies included, and the non-test
# library build then fails to resolve `gpui_kit`.
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui-component = { version = "=0.7.1", features = ["test-support"] }

[lints.rust]
# `deny` (rather than `forbid`) so a single targeted module - currently
# only `src/biometric/macos.rs`, which wraps LocalAuthentication FFI
# whose bindings expose `unsafe fn` even for ordinary calls - can opt
# in with a documented `#![allow(unsafe_code)]`. Every other file in
# the workspace still fails the build on the first `unsafe` block; the
# allow-list lives in code review.
unsafe_code = "deny"
