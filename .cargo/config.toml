[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

# No `[build] rustflags = "-C target-cpu=native"` here on purpose: a committed
# `native` bakes the build machine's CPU features into a distributed binary and
# any x86_64 or universal build then faults on older Macs. Developers who want
# it locally put it in ~/.cargo/config.toml (see README, Development).

# Performance optimizations for ARMv8 are available since Rust 1.61
# via the `aes_armv8` configuration option.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8"]
