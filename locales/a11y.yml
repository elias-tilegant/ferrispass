_version: 2
# Accessible names for controls that show no text of their own, such as icon
# buttons, and the states VoiceOver reads after a name. Nobody sees them.
a11y:
  copy_password:
    en: Copy password
    de: Passwort kopieren
  reveal_password:
    en: Show password
    de: Passwort zeigen
  # The description of a secret while it is hidden.
  hidden:
    en: hidden
    de: verborgen
  # The name of the ring next to a one-time code. The seconds are rounded
  # up to a multiple of five, so the name changes at most every five seconds.
  one_time_code_expires:
    en: One-time code, expires in %{seconds} seconds
    de: Einmalcode, läuft in %{seconds} Sekunden ab
  # The button at the end of the panel footer that opens its menu.
  more_actions:
    en: More actions
    de: Weitere Aktionen
  # The description of a disabled control. GPUI has no disabled flag for
  # assistive technology yet.
  not_available:
    en: not available
    de: nicht verfügbar
  # The description of a button whose action is running.
  in_progress:
    en: in progress
    de: läuft
