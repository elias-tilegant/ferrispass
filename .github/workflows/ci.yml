name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-message scan needs the range, not just the tip.
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # `--locked` keeps the exact gpui-pre pins in Cargo.toml and Cargo.lock
      # together: GPUI Kit requires one gpui-pre snapshot (=0.3.8), and every
      # other crate in the tree is held by the lock alone. A drifting lock must
      # fail the build, not slip through.
      - name: Build
        run: cargo build --locked --verbose

      - name: Build headless CLI
        run: cargo build --locked --bin ferrispass-cli --verbose

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --verbose

      # UI copy, comments and docs use plain hyphens, never em or en dashes.
      # Every tracked file, not a list of directories: the list left out
      # scripts/, and two build scripts kept their dashes through a whole
      # release cycle because of it. A rule that says "everywhere" is cheaper
      # to enforce everywhere than to keep a list current.
      - name: Reject em and en dashes
        run: |
          # The pattern is built from the UTF-8 bytes of the two dashes and
          # matched with -E: the runner's grep is BSD grep, which has no -P.
          # The earlier -P form exited 2 on every run, and both scans read
          # that as clean. The self-test makes a grep that cannot match fail
          # the job instead of passing it.
          pat=$(printf '\342\200\224|\342\200\223')
          printf 'x\342\200\224\n' | grep -qE "$pat" || { echo "::error::dash scan self-test failed"; exit 1; }
          # Collected rather than tested by exit code: xargs may split the
          # file list into several greps, and only the last one's status
          # would survive the pipeline. -I keeps binary assets out, where
          # the three bytes of an em dash can occur by chance.
          found=$(git ls-files -z | xargs -0 grep -nIE "$pat" || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::em or en dash found in a file; use a plain hyphen"
            exit 1
          fi

      # On a pull request this is every commit the branch adds; on a push,
      # the ones the push introduced. A first push to a new branch has no
      # comparable base, and skipping is better than failing on it.
      - name: Reject em and en dashes in commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git rev-parse --quiet --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
            echo "no comparable base for this event; skipping"
            exit 0
          fi
          # Same pattern and self-test as the file scan above.
          pat=$(printf '\342\200\224|\342\200\223')
          printf 'x\342\200\224\n' | grep -qE "$pat" || { echo "::error::dash scan self-test failed"; exit 1; }
          if git log --format='%B' "$BASE_SHA..$HEAD_SHA" | grep -nE "$pat"; then
            echo "::error::em or en dash found in a commit message; use a plain hyphen"
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # The action reports through a check run, which the workflow-wide
    # `contents: read` does not allow: it read the advisories fine and then
    # failed the job on "Resource not accessible by integration" while
    # publishing them. Granted per job, so nothing else gains the write.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
