name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# Required Secrets (set in repo Settings → Secrets and variables → Actions):
#
#   APPLE_CERT_BASE64         - base64-encoded .p12 of Developer ID Application cert
#   APPLE_CERT_PASSWORD       - password set when exporting the .p12
#   APPLE_ID                  - Apple ID email used for notarization
#   APPLE_TEAM_ID             - 10-char Team ID (5GAMHB3974)
#   APPLE_NOTARIZE_PASSWORD   - app-specific password from appleid.apple.com
#   MINISIGN_PRIVATE_KEY      - full text of ~/.ferrispass/minisign.key (2 lines)
#   MINISIGN_PASSWORD         - passphrase set when generating the keypair
#
# Apple secrets - how to export the .p12 (one-time, on the Mac with the cert):
#   1. Keychain Access → "Developer ID Application" cert → File → Export → .p12
#   2. Set a password (this becomes APPLE_CERT_PASSWORD)
#   3. base64 < cert.p12 | pbcopy → paste as APPLE_CERT_BASE64
#
# Minisign secrets - generated by scripts/setup-minisign.sh:
#   - MINISIGN_PRIVATE_KEY = `cat ~/.ferrispass/minisign.key` (paste full content)
#   - MINISIGN_PASSWORD    = the passphrase you typed during setup-minisign.sh

jobs:
  build:
    name: Build & notarize DMG
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build tools
        run: brew install create-dmg jq

      - name: Import code-signing cert
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Set up notarization keychain profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "ferrispass-notarize" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD"

      - name: Verify icon present
        run: |
          if [ ! -f bundle/icon.png ]; then
            echo "✗ bundle/icon.png missing - commit the icon before tagging a release" >&2
            exit 1
          fi

      - name: Verify tag matches package version
        run: |
          VERSION="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -1)"
          if [ "${RELEASE_TAG}" != "v${VERSION}" ]; then
            echo "✗ Tag ${RELEASE_TAG} does not match Cargo.toml version ${VERSION}" >&2
            exit 1
          fi

      # No updater-signing secret is staged or exported until after this step.
      # Cargo and dependency build scripts therefore cannot read the private
      # key path or passphrase.
      - name: Build, code-sign, notarize, staple, generate update manifest
        run: scripts/build-mac.sh

      - name: Upload unsigned release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/update.json
          if-no-files-found: error
          retention-days: 1

  notes:
    name: Generate release notes
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Generate release notes from conventional commits
        env:
          # Pin so a future cliff bump can't silently change the notes
          # format without us reviewing it.
          GIT_CLIFF_VERSION: 2.13.1
          GITHUB_REPO: ${{ github.repository }}
          # cliff 2.x auto-queries the GitHub API for PR/contributor
          # metadata when the remote is github.com. Without a token it
          # uses anonymous requests (60/h shared per IP) and the runner
          # pool gets rate-limited → 403 → release fails. Passing the
          # workflow's auto-issued GITHUB_TOKEN lifts the budget to the
          # standard 1000/h authenticated rate.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # We used to call orhun/git-cliff-action@v4 here, but its
          # post-step uses GNU `stat -c %s` to size-check the output
          # file, which fails on macOS's BSD stat (`stat: %s: bad
          # format`) and aborts the whole release. Cliff itself ran
          # fine - only the action's housekeeping was broken. Calling
          # the binary directly sidesteps that and gives us one less
          # third-party dependency to track.
          set -euo pipefail
          ARCHIVE="git-cliff-${GIT_CLIFF_VERSION}-aarch64-apple-darwin.tar.gz"
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${ARCHIVE}" \
            | tar -xz
          BIN="git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          chmod +x "$BIN"

          # `--latest` outputs only the commits between the previous tag
          # and the one we're releasing now. `--strip header` drops cliff's
          # default top-of-file marker since the GitHub Release body is
          # already a per-release context.
          "$BIN" --config cliff.toml --latest --strip header --output RELEASE_NOTES.md

      # The generated list says what changed; a hand-written note says what
      # it means for the people using the app. When the tagged commit has one
      # for this tag, it goes above the list. The result is the one file that
      # becomes both the release page and the notes in update.json, so the
      # size check in the sign job covers the note too.
      - name: Prepend the hand-written release note
        run: |
          set -euo pipefail
          NOTE="docs/release-notes/${RELEASE_TAG}.md"
          if [ -f "${NOTE}" ]; then
            { cat "${NOTE}"; printf '\n'; cat RELEASE_NOTES.md; } > RELEASE_NOTES.md.tmp
            mv RELEASE_NOTES.md.tmp RELEASE_NOTES.md
            echo "Prepended ${NOTE}"
          else
            echo "No ${NOTE}; the notes are the generated list only"
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign updater artefacts
    needs: [build, notes]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download unsigned release artefacts
        uses: actions/download-artifact@v4
        with:
          name: unsigned-release
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Install signing tools
        run: brew install minisign jq

      - name: Inject release notes into update manifest
        run: |
          set -euo pipefail
          NOTES_SIZE="$(wc -c < RELEASE_NOTES.md | tr -d '[:space:]')"
          if [ "${NOTES_SIZE}" -gt 131072 ]; then
            echo "✗ Release notes exceed the 128 KiB signing limit" >&2
            exit 1
          fi
          jq --rawfile notes RELEASE_NOTES.md '. + {notes: $notes}' \
            dist/update.json > dist/update.json.tmp
          mv dist/update.json.tmp dist/update.json

      - name: Stage minisign private key
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ferrispass"
          KEY="${RUNNER_TEMP}/ferrispass/minisign.key"
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"

          if ! head -1 "$KEY" | grep -q "untrusted comment"; then
              echo "✗ MINISIGN_PRIVATE_KEY secret is malformed." >&2
              echo "  Expected the complete two-line minisign secret key." >&2
              exit 1
          fi

      - name: Sign updater payload and final manifest
        env:
          MINISIGN_KEY: ${{ runner.temp }}/ferrispass/minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          trap 'rm -f "${MINISIGN_KEY}"' EXIT
          scripts/build-mac.sh --sign-update

      - name: Upload signed release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.minisig
            dist/update.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [sign, notes]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release artefacts
        uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Attach everything the project needs:
          # - .dmg          : human-friendly first download
          # - .app.tar.gz   : payload the in-app updater fetches
          # - .minisig      : detached signatures for both archives and the .dmg
          # - update.json + .minisig: signed manifest binding version, URL and payload
          # - SHA256SUMS    : sums of the .dmg and both archives, for downloads by hand
          files: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.minisig
            dist/update.json
            dist/SHA256SUMS
          # A pattern that matches nothing stops the step before the release
          # is created, instead of publishing it without that file.
          fail_on_unmatched_files: true
          # Body comes from git-cliff's isolated notes job instead of GitHub's
          # generate_release_notes - the latter only produces a Full
          # Changelog link when there are no PRs/labels to categorise.
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          # Every tag goes out as a pre-release: test builds, release
          # candidates and 0.9.x fixes alike. The in-app updater reads
          # releases/latest, which GitHub resolves to the newest release
          # without this flag, so nothing here reaches existing installs.
          # Clearing the flag by hand (gh release edit vX.Y.Z
          # --prerelease=false --latest) is the deliberate step that ships a
          # version to everyone, and it is never done for a tag with a hyphen.
          prerelease: true

  # The permanent release kanal-vorab (no v, so it never starts this
  # workflow) holds the manifest of the highest version tagged so far. The
  # app does not read it yet. Test builds will, to find the next test build;
  # builds without a pre-release suffix keep reading only releases/latest.
  #
  # The channel only moves forward: a tag whose version is not higher than
  # the one already there, such as a 0.9.x fix after a test build, leaves it
  # as it is. Versions are compared by SemVer precedence, which ranks
  # 0.10.0-pre.3 below 0.10.0; sort -V does not.
  #
  # A job of its own, so that one run at a time reads and writes the
  # channel: two tags published close together would otherwise both read it
  # before either writes, and the lower one could land last. A channel job
  # that finds another one already waiting replaces it, and the replaced one
  # shows as cancelled; re-run it.
  channel:
    name: Update the pre-release channel
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: kanal-vorab
      cancel-in-progress: false
    steps:
      # For scripts/semver-compare.py. First, because a checkout empties the
      # workspace, and without credentials, because nothing here pushes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download signed release artefacts
        uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: dist

      # kanal-vorab holds exactly update.json and its signature, or nothing
      # before the first tag. Anything else, and a missing release, stops the
      # run: the channel is repaired by hand (docs/release-process.md), never
      # skipped or overwritten blindly.
      - name: Update the pre-release channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tagged="$(jq -er .version dist/update.json)"
          held="$(gh release view kanal-vorab --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '[.assets[].name] | sort | join(" ")')"
          case "${held}" in
            "")
              echo "kanal-vorab is empty; it starts at ${tagged}"
              ;;
            "update.json update.json.minisig")
              gh release download kanal-vorab --repo "${GITHUB_REPOSITORY}" \
                --pattern update.json --output "${RUNNER_TEMP}/channel.json"
              current="$(jq -er .version "${RUNNER_TEMP}/channel.json")"
              order="$(python3 -I scripts/semver-compare.py "${tagged}" "${current}")"
              if [ "${order}" != higher ]; then
                echo "::notice::kanal-vorab stays at ${current}; ${tagged} is not higher"
                exit 0
              fi
              ;;
            *)
              echo "::error::kanal-vorab holds '${held}', not update.json and update.json.minisig; repair it by hand"
              exit 1
              ;;
          esac
          gh release upload kanal-vorab \
            dist/update.json dist/update.json.minisig \
            --clobber --repo "${GITHUB_REPOSITORY}"
