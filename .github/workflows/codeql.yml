name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Pick up newly published queries even when the repository is unchanged.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust's CodeQL extractor supports buildless analysis. Use the x86-64
          # macOS image: CodeQL's Apple Silicon support is still in beta, and
          # the ARM image cannot currently locate rust-analyzer's proc-macro
          # server, which substantially degrades call-target resolution.
          - language: rust
            build-mode: none
            runner: macos-15-intel
          # Workflow analysis needs no compilation and can use a Linux runner.
          - language: actions
            build-mode: none
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Buildless Rust extraction still needs rustup, cargo, and the toolchain's
      # proc-macro server to resolve types and expand macros accurately.
      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
